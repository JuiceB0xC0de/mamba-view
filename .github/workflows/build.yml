name: build

# Builds the private image on a GitHub runner rather than locally, because the
# workstation is arm64 and this image is linux/amd64: a local build would go
# through QEMU emulation and take hours instead of minutes.
#
# The runner checks out this repository and nothing else, so src/ must be
# committed.  It is generated by `./build.sh --stage` from ~/mamba3-project and
# is never edited in place.  Regenerate it before committing; do not fix a bug
# in src/, fix it at the source and re-stage.

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:
    inputs:
      tag:
        description: 'image tag'
        required: false
        default: 'latest'

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # The CUDA 12.8.1 devel base plus torch cu128 plus TileLang runs to
      # roughly 20 GB unpacked, and a stock runner has about 14 GB free. This
      # reclaims ~25 GB of preinstalled toolchains nothing here uses. Without
      # it the build dies on "no space left on device" partway through pip.
      - name: reclaim disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" \
                      /usr/local/share/powershell /usr/share/swift
          sudo docker image prune --all --force
          df -h /

      - name: verify staged sources
        run: |
          test -d src || { echo "src/ is missing. run ./build.sh --stage and commit it."; exit 1; }
          n=$(find src -name 'camera-*.py' | wc -l)
          test "$n" -eq 6 || { echo "expected 6 cameras in src/, found $n"; exit 1; }
          echo "staged sources:"
          find src -type f | sort | sed 's/^/  /'

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ inputs.tag || 'latest' }}
            type=sha,format=long

      # No --no-cache anywhere: the layer cache is what makes a rerun a resume
      # rather than a restart, and this image has a 20-minute pip section.
      - name: build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: result
        run: |
          echo "pushed:"
          echo "${{ steps.meta.outputs.tags }}" | sed 's/^/  /'
          echo
          echo "the package is private by default. RunPod needs a registry"
          echo "credential: a GitHub PAT with read:packages."
